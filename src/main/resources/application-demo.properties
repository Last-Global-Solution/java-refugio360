# Perfil de demonstração hospedada. Herda H2 em arquivo e JPA de application.properties.
# O seed continua desligado por padrão e exige DEMO_SEED_ENABLED=true.
server.address=0.0.0.0
spring.h2.console.enabled=false
app.jwt.secret=${JWT_SECRET}
app.bootstrap-gestor.email=${GESTOR_EMAIL}
app.bootstrap-gestor.password=${GESTOR_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Sem broker, não iniciar consumidores; habilitar explicitamente após configurar RabbitMQ.
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_ENABLED:false}
spring.rabbitmq.listener.direct.auto-startup=${RABBITMQ_LISTENER_ENABLED:false}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
