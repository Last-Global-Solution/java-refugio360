server.port=8080

# H2 local em arquivo para os dados sobreviverem ao reinício da API.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/refugio360;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (somente desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT: substitua em produção por uma chave aleatória de pelo menos 32 bytes.
app.jwt.secret=${JWT_SECRET:refugio360-chave-local-trocar-em-producao-2026}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.bootstrap-gestor.email=${GESTOR_EMAIL:gestor@refugio360.local}
app.bootstrap-gestor.password=${GESTOR_PASSWORD:gestor12345}

# Gemini pela API compatível com OpenAI, usando Spring AI.
spring.ai.openai.api-key=${GEMINI_API_KEY:local-disabled-key}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.openai.chat.temperature=0.2

# CORS do front local; configure a origem exata em produção.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
